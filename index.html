<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f59f00" />
<title>Feliz Día de las Flores Amarillas 🌻</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/styles.css">
</head>
<body>

<canvas id="bgPetals" aria-hidden="true"></canvas>

<button class="sound-toggle" id="soundToggle" aria-label="Silenciar sonido" title="Silenciar sonido">🔊</button>
<button class="music-toggle" id="musicToggle" aria-label="Pausar música" title="Pausar música">🎵</button>
<audio id="bgMusic" src="assets/musica.mp3" preload="auto"></audio>

<main class="stage">

  <section class="envelope-stage" id="envelopeStage">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir sobre">
      <svg class="envelope-leaf envelope-leaf-left" viewBox="0 0 40 20" aria-hidden="true">
        <path d="M2 10 Q14 -4 38 4 Q24 14 2 10 Z" fill="#74b816"/>
      </svg>
      <svg class="envelope-leaf envelope-leaf-right" viewBox="0 0 40 20" aria-hidden="true">
        <path d="M2 10 Q14 -4 38 4 Q24 14 2 10 Z" fill="#74b816"/>
      </svg>
      <div class="envelope-body">
        <p class="envelope-address">
          Para ti
          <svg class="mini-heart" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M12 21s-7.5-4.6-10-9.1C0.3 8.7 1.8 5 5.4 5c2 0 3.4 1.1 4.1 2.4C10.2 6.1 11.6 5 13.6 5c3.6 0 5.1 3.7 3.4 6.9C19.5 16.4 12 21 12 21z" fill="#ff6b35"/>
          </svg>
        </p>
        <div class="envelope-letter-peek"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-stamp" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="100%" height="100%">
            <g fill="#f59f00">
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(0 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(51 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(102 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(153 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(204 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(255 20 20)"/>
              <ellipse cx="20" cy="20" rx="4.5" ry="8" transform="rotate(306 20 20)"/>
            </g>
            <circle cx="20" cy="20" r="5" fill="#7a4b00"/>
          </svg>
        </div>
        <div class="envelope-seal" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 21s-7.5-4.6-10-9.1C0.3 8.7 1.8 5 5.4 5c2 0 3.4 1.1 4.1 2.4C10.2 6.1 11.6 5 13.6 5c3.6 0 5.1 3.7 3.4 6.9C19.5 16.4 12 21 12 21z" fill="#fffdf6"/>
          </svg>
        </div>
      </div>
    </div>
    <p class="envelope-hint">Toca el sobre para abrirlo</p>
  </section>

  <section class="card" id="letterCard" hidden>
    <div class="flourish" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <g>
          <g transform="rotate(0 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(45 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(90 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(135 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(180 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(225 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(270 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
          <g transform="rotate(315 50 50)"><ellipse cx="50" cy="24" rx="9" ry="18" fill="#ffd43b" stroke="#f59f00" stroke-width="1.5"/></g>
        </g>
        <circle cx="50" cy="50" r="13" fill="#7a4b00"/>
        <circle cx="50" cy="50" r="13" fill="none" stroke="#3b2400" stroke-width="1" stroke-dasharray="2 3"/>
      </svg>
    </div>

    <p class="hero-title">Para ti</p>
    <p class="hero-sub">21 de septiembre · Día de las Flores Amarillas</p>

    <div class="message-box">
      <p class="message" id="messageText"></p>
    </div>

    <div class="dots" id="dots"></div>

    <button class="btn" id="actionBtn">Toca aquí 💛</button>
  </section>

  <section class="reveal" id="revealCard" hidden>
    <canvas id="flowerCanvas"></canvas>
    <p class="reveal-title">Feliz Día de las Flores Amarillas</p>

    <div class="photo-frame" id="photoFrame">
      <img src="assets/foto.jpg" alt="Foto de ustedes dos" id="couplePhoto" />
      <p class="photo-placeholder" id="photoPlaceholder">📷 Coloca su foto en<br><code>assets/foto.jpg</code></p>
    </div>

    <p class="closing-message">Solo quería hacerte algo bonito 💝</p>
    <button class="btn ghost" id="replayBtn">Ver florecer de nuevo 🌼</button>
  </section>

</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
